<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QaytarMe Story Design</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;800&display=swap');

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #1a1a1a;
            font-family: 'Outfit', sans-serif;
        }

        .story-container {
            width: 1080px; /* 1080x1920 is standard IG Story size, scaled down for view */
            height: 1920px;
            background: linear-gradient(135deg, #F7F6E2 0%, #ffffff 50%, #effaf7 100%);
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
            /* Zoom out to fit screen if needed, or user can view full size */
            transform: scale(0.4); 
            transform-origin: center;
        }

        /* Abstract Background Elements */
        .orb-1 {
            position: absolute;
            top: -10%;
            right: -20%;
            width: 1200px;
            height: 1200px;
            background: radial-gradient(circle, #A9D3C9 0%, rgba(169, 211, 201, 0) 70%);
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.6;
            animation: breathe 8s infinite alternate;
        }

        .orb-2 {
            position: absolute;
            bottom: -10%;
            left: -10%;
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, #d4ece7 0%, rgba(255,255,255,0) 70%);
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.8;
            animation: breathe 10s infinite alternate-reverse;
        }

        /* Glassmorphism Card */
        .glass-card {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -60%);
            width: 80%;
            padding: 80px 40px;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: 60px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(46, 45, 43, 0.1);
        }

        .icon {
            font-size: 150px;
            margin-bottom: 40px;
            display: inline-block;
            filter: drop-shadow(0 10px 20px rgba(169, 211, 201, 0.6));
            animation: float 6s ease-in-out infinite;
        }

        h1 {
            font-size: 72px;
            font-weight: 800;
            color: #2E2D2B;
            margin: 0;
            line-height: 1.1;
            letter-spacing: -2px;
        }

        h1 span {
            color: #5fa593;
        }

        p {
            font-size: 36px;
            color: #2E2D2B;
            opacity: 0.7;
            margin-top: 30px;
            font-weight: 500;
            line-height: 1.4;
        }

        /* Fake UI for Link Sticker placement guide */
        .sticker-zone {
            position: absolute;
            bottom: 20%;
            left: 0;
            width: 100%;
            text-align: center;
        }

        .arrow {
            font-size: 60px;
            color: #2E2D2B;
            opacity: 0.4;
            animation: bounce 2s infinite;
        }

        /* Noise Texture */
        .noise {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 10;
        }

        @keyframes breathe {
            0% { transform: scale(1); }
            100% { transform: scale(1.1); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
            40% {transform: translateY(-20px);}
            60% {transform: translateY(-10px);}
        }
        
        .logo-text {
            position: absolute;
            top: 80px;
            left: 0;
            width: 100%;
            text-align: center;
            font-size: 40px;
            font-weight: 800;
            letter-spacing: 4px;
            color: #2E2D2B;
            opacity: 0.3;
            text-transform: uppercase;
        }

    </style>
</head>
<body>
    <div class="story-container">
        <div class="noise"></div>
        <div class="orb-1"></div>
        <div class="orb-2"></div>
        
        <div class="logo-text">QAYTARME APP</div>

        <div class="glass-card">
            <div class="icon">🔍</div>
            <h1>Siz nimanidir <br> <span>yo'qotdingizmi?</span></h1>
            <p>Yoki shahar qahramoni bo'lib, birovning buyumini topib bermoqchimisiz?</p>
        </div>

        <div class="sticker-zone">
            <div style="font-size: 28px; color: #2E2D2B; margin-bottom: 20px; font-weight: bold; opacity: 0.6;">JAVOBINGIZ MUHIM 👇</div>
            <div class="arrow">⬇</div>
        </div>
    </div>
</body>
</html>
